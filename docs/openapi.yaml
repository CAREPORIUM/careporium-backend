openapi: 3.0.3

info:
  title: CAREPORIUM Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the CAREPORIUM healthcare-worker shift marketplace backend.

    Facilities can register, post shifts, and fund shifts through the payment provider.
    Workers can manage their profiles, submit verification documents, apply for shifts,
    and record attendance.

    Shift creation initiates payment. A shift awaiting payment remains in
    pending_payment status and becomes open only after payment is confirmed.

    The platform commission is 10% of the worker payout amount.

servers:
  - url: https://careporium-backend.onrender.com
    description: Production server
  - url: http://localhost:8089
    description: Local development server

tags:
  - name: Authentication
  - name: Worker Profiles
  - name: Facility Profiles
  - name: Shifts
  - name: Shift Applications
  - name: Attendance
  - name: Payments
  - name: Admin

security:
  - bearerAuth: []

paths:

  # =========================
  # AUTHENTICATION
  # =========================

  /api/auth/v1/register/worker:
    post:
      tags: [Authentication]
      summary: Register a worker account and profile
      description: Creates a worker account and sends an account-verification OTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  example: Ada Okafor
                email:
                  type: string
                  format: email
                  example: ada@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                phoneNumber:
                  type: string
                profession:
                  type: string
                  example: Nurse
                specialty:
                  type: string
                  example: Emergency
                yearsOfExperience:
                  type: integer
                  minimum: 0
                  example: 3
                location:
                  $ref: '#/components/schemas/Location'
      responses:
        '201':
          description: Worker account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/register/facility:
    post:
      tags: [Authentication]
      summary: Register a facility account and upload required documents
      description: |
        Creates a facility account and uploads its business registration certificate,
        facility licence, and tax identification document.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - facilityName
                - facilityType
                - email
                - phoneNumber
                - password
                - location.address
                - location.city
                - location.state
                - location.country
                - businessRegCert
                - facilityLicense
                - taxID
              properties:
                facilityName:
                  type: string
                  example: CarePlus Hospital
                facilityType:
                  type: string
                  example: Hospital
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                location.address:
                  type: string
                location.city:
                  type: string
                location.state:
                  type: string
                location.country:
                  type: string
                  example: Nigeria
                secondaryContact.fullName:
                  type: string
                secondaryContact.position:
                  type: string
                secondaryContact.email:
                  type: string
                  format: email
                secondaryContact.phoneNumber:
                  type: string
                businessRegCert:
                  type: string
                  format: binary
                facilityLicense:
                  type: string
                  format: binary
                taxID:
                  type: string
                  format: binary
      responses:
        '201':
          description: Facility account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/verify-account:
    post:
      tags: [Authentication]
      summary: Verify account with email OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '123456'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend account verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/logout:
    post:
      tags: [Authentication]
      summary: Log out by invalidating previously issued tokens
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/v1/get-profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's base profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/v1/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/verify-reset-code:
    post:
      tags: [Authentication]
      summary: Verify password reset OTP
      description: Verifies the OTP sent to the user's email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: Password reset OTP verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/resend-reset-code:
    post:
      tags: [Authentication]
      summary: Resend password reset OTP
      description: Sends a new password reset OTP to the user's email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Password reset OTP resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password using OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  example: '123456'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  # =========================
  # WORKER PROFILES
  # =========================

  /api/worker/v1/get-worker-profile/{userId}:
    get:
      tags: [Worker Profiles]
      summary: Get a worker profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/worker/v1/update-worker-profile/{userId}:
    put:
      tags: [Worker Profiles]
      summary: Update a worker profile and upload documents
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                profession:
                  type: string
                specialty:
                  type: string
                yearsOfExperience:
                  type: integer
                  minimum: 0
                about:
                  type: string
                address:
                  type: string
                street:
                  type: string
                state:
                  type: string
                country:
                  type: string
                professionalLicense:
                  type: string
                  format: binary
                idDocument:
                  type: string
                  format: binary
                educationCert:
                  type: string
                  format: binary
                proofOfLocation:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================
  # FACILITY PROFILES
  # =========================

  /api/facility/v1/get-facility-profile:
    get:
      tags: [Facility Profiles]
      summary: Get the authenticated facility profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/facility/v1/update-facility-profile:
    put:
      tags: [Facility Profiles]
      summary: Update the authenticated facility profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityName:
                  type: string
                facilityType:
                  type: string
                location:
                  $ref: '#/components/schemas/Location'
                secondaryContact:
                  $ref: '#/components/schemas/SecondaryContact'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================
  # SHIFTS
  # =========================

  /api/shifts/v1/create-shift:
    post:
      tags: [Shifts]
      summary: Create a shift and initiate payment
      description: |
        Creates a shift and initiates funding for the entire shift.

        The platform commission is 10% of the worker payout amount.
        The shift remains in pending_payment status until payment is confirmed.
        Once payment is confirmed, the shift becomes open.

        If payment initialization fails, an error is returned. The response
        may include shiftId so the facility can retry payment for the existing shift.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
            example:
              profession: Nurse
              specialty: Emergency
              shiftDate: '2026-10-20'
              shiftType: Day
              startTime: '08:00'
              endTime: '16:00'
              professionalsNeeded: 2
              minimumExperience: 2
              location: Lagos
              responsibilities: Provide patient care during the shift
              reqCredentials:
                - Valid professional license
              payRate: 25000
              isUrgent: false
              clientPlatform: web
      responses:
        '201':
          description: Shift created and payment initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShiftPaymentResponse'
        '400':
          description: Invalid shift details or payment initialization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/shifts/v1/get-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve available shifts
      description: Returns shifts available for discovery.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            example: open
        - in: query
          name: profession
          schema:
            type: string
        - in: query
          name: specialty
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/shifts/v1/get-single-shift/{shiftId}:
    get:
      tags: [Shifts]
      summary: Retrieve a shift by ID
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shifts/v1/get-facility-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve shifts posted by the authenticated facility
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/shifts/v1/update-shift/{shiftId}:
    put:
      tags: [Shifts]
      summary: Update a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/shifts/v1/close-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Close a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/shifts/v1/complete-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Mark a shift as completed
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/shifts/v1/delete-shift/{shiftId}:
    delete:
      tags: [Shifts]
      summary: Delete a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================
  # SHIFT APPLICATIONS
  # =========================

  /api/applications/v1/apply/{shiftId}:
    post:
      tags: [Shift Applications]
      summary: Apply for a shift as a worker
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/applications/v1/my-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve applications submitted by the authenticated worker
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/applications/v1/facility-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve applications for the authenticated facility's shifts
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/applications/v1/update-application/{applicationId}:
    patch:
      tags: [Shift Applications]
      summary: Update an application status
      description: Allows an authorized facility to accept or reject an application.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
            examples:
              acceptApplication:
                summary: Accept an application
                value:
                  status: accepted
              rejectApplication:
                summary: Reject an application
                value:
                  status: rejected
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================
  # ATTENDANCE
  # =========================

  /api/attendance/v1/qr/{shiftId}:
    get:
      tags: [Attendance]
      summary: Generate or retrieve a shift attendance QR token
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/attendance/v1/clock-in:
    post:
      tags: [Attendance]
      summary: Clock in using a QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/attendance/v1/clock-out:
    post:
      tags: [Attendance]
      summary: Clock out using a QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =========================
  # PAYMENTS
  # =========================

  /api/payments/v1/retry/{shiftId}:
    post:
      tags: [Payments]
      summary: Retry payment for a shift
      description: |
        Allows the facility that owns the shift to retry payment when the shift
        is awaiting payment. Payment initialization does not itself confirm that
        the funds have been received.

        The shift becomes open after the provider confirms funding.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Payment retry initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryShiftPaymentResponse'
        '400':
          description: Shift is not eligible for retry or payment initialization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payments/v1/harrenapay/webhook:
    post:
      tags: [Payments]
      summary: Receive HarrenaPay payment notifications
      description: |
        Provider-to-server webhook endpoint.

        HarrenaPay sends payment events to this endpoint. Requests must include
        the x-harrenapay-signature header. The server verifies the signature
        against the raw request body before processing the event.

        This endpoint is intended for the payment provider, not for a frontend
        client to mark its own payment as successful.
      security: []
      parameters:
        - in: header
          name: x-harrenapay-signature
          required: true
          description: HMAC-SHA256 signature of the raw request body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarrenaPayWebhookEvent'
            examples:
              escrowFunded:
                summary: Escrow funded event
                value:
                  event: escrow.funded
                  reference: careporium_shift_671234abcd
                  amount: 5500000
                  currency: NGN
              paymentSuccess:
                summary: Payment success event
                value:
                  event: payment.success
                  reference: careporium_shift_671234abcd
                  amount: 5500000
                  currency: NGN
              paymentFailed:
                summary: Payment failure event
                value:
                  event: payment.failed
                  reference: careporium_shift_671234abcd
                  amount: 5500000
                  currency: NGN
      responses:
        '200':
          description: Webhook processed or acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'
        '400':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'
        '401':
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'
        '500':
          description: Webhook processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentErrorResponse'

  # =========================
  # ADMIN
  # =========================

  /api/admin/v1/workers:
    get:
      tags: [Admin]
      summary: Retrieve all workers
      description: Admin access required. Populated user details should exclude passwords and OTP fields.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/pending:
    get:
      tags: [Admin]
      summary: Retrieve workers with pending overall verification status
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/{workerId}:
    get:
      tags: [Admin]
      summary: Retrieve one worker by ID
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/v1/workers/{workerId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a worker document
      description: |
        Rejecting a document requires a non-empty comment.
        Worker verification status is recalculated from the four required documents.
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerDocumentReviewInput'
            examples:
              verifyDocument:
                summary: Verify a professional license
                value:
                  documentType: professionalLicense
                  status: verified
              rejectDocument:
                summary: Reject an identity document
                value:
                  documentType: idDocument
                  status: rejected
                  comment: The uploaded document is unclear.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/facilities:
    get:
      tags: [Admin]
      summary: Retrieve all facilities
      description: Admin access required. Populated user details should exclude passwords and OTP fields.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/pending:
    get:
      tags: [Admin]
      summary: Retrieve facilities with pending overall verification status
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/{facilityId}:
    get:
      tags: [Admin]
      summary: Retrieve one facility by ID
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/v1/facilities/{facilityId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a facility document
      description: |
        Rejecting a document requires a non-empty comment.
        Facility verification status is recalculated from the three required documents.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityDocumentReviewInput'
            examples:
              verifyDocument:
                summary: Verify a business registration certificate
                value:
                  documentType: businessRegCert
                  status: verified
              rejectDocument:
                summary: Reject a tax identification document
                value:
                  documentType: taxID
                  status: rejected
                  comment: The uploaded tax document is invalid.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/verification-queue:
    get:
      tags: [Admin]
      summary: Retrieve pending worker and facility document reviews
      description: Returns individual uploaded documents whose verification status is pending.
      responses:
        '200':
          description: Combined verification queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationQueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/dashboard/stats:
    get:
      tags: [Admin]
      summary: Retrieve admin dashboard statistics
      description: |
        Returns total workers, verified workers, total facilities,
        verified facilities, pending document reviews, active shifts,
        and completed shifts.
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalWorkers:
                        type: integer
                        example: 120
                      verifiedWorkers:
                        type: integer
                        example: 78
                      totalFacilities:
                        type: integer
                        example: 25
                      verifiedFacilities:
                        type: integer
                        example: 18
                      pendingVerifications:
                        type: integer
                        example: 14
                      activeShifts:
                        type: integer
                        example: 9
                      completedShifts:
                        type: integer
                        example: 43
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string

    WorkerId:
      in: path
      name: workerId
      required: true
      schema:
        type: string

    FacilityId:
      in: path
      name: facilityId
      required: true
      schema:
        type: string

    ShiftId:
      in: path
      name: shiftId
      required: true
      schema:
        type: string

    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string

  schemas:

    RegistrationResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          additionalProperties: true

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
          type: object
          additionalProperties: true

    UserSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [worker, facility, admin]
        isVerified:
          type: boolean

    Location:
      type: object
      properties:
        address:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string

    SecondaryContact:
      type: object
      properties:
        fullName:
          type: string
        position:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string

    ShiftInput:
      type: object
      required:
        - profession
        - shiftDate
        - startTime
        - endTime
        - professionalsNeeded
        - payRate
      properties:
        profession:
          type: string
          example: Nurse
        specialty:
          type: string
          example: Emergency
        shiftDate:
          type: string
          format: date
          example: '2026-10-20'
        shiftType:
          type: string
          example: Day
        startTime:
          type: string
          example: '08:00'
        endTime:
          type: string
          example: '16:00'
        professionalsNeeded:
          type: integer
          minimum: 1
          example: 2
        minimumExperience:
          type: integer
          minimum: 0
          example: 2
        location:
          type: string
          example: Lagos
        responsibilities:
          type: string
          example: Provide patient care during the shift
        reqCredentials:
          type: array
          items:
            type: string
          example:
            - Valid professional license
        arrivalInstructions:
          type: string
        payRate:
          type: number
          minimum: 0.01
          description: Pay rate per worker, in NGN, if that is how the service interprets this field.
          example: 25000
        isUrgent:
          type: boolean
          default: false
        clientPlatform:
          type: string
          enum: [web, mobile]
          default: web

    UpdateApplicationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]

    WorkerDocumentReviewInput:
      type: object
      required:
        - documentType
        - status
      properties:
        documentType:
          type: string
          enum:
            - professionalLicense
            - idDocument
            - educationCert
            - proofOfLocation
        status:
          type: string
          enum: [verified, rejected]
        comment:
          type: string
          description: Required when rejecting a document.

    FacilityDocumentReviewInput:
      type: object
      required:
        - documentType
        - status
      properties:
        documentType:
          type: string
          enum:
            - businessRegCert
            - facilityLicense
            - taxID
        status:
          type: string
          enum: [verified, rejected]
        comment:
          type: string
          description: Required when rejecting a document.

    VerificationQueueItem:
      type: object
      properties:
        documentType:
          type: string
        documentUrl:
          type: string
          format: uri
        status:
          type: string
          example: pending
        comment:
          type: string
        workerId:
          type: string
        facilityId:
          type: string
        userId:
          type: string
        fullName:
          type: string
        facilityName:
          type: string
        profession:
          type: string
        facilityType:
          type: string

    CreateShiftPaymentResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            shift:
              type: object
              additionalProperties: true
            payment:
              $ref: '#/components/schemas/PaymentDetails'

    RetryShiftPaymentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            shiftId:
              type: string
            payment:
              $ref: '#/components/schemas/PaymentDetails'

    PaymentDetails:
      type: object
      properties:
        _id:
          type: string
        shift:
          type: string
        facility:
          type: string
        currency:
          type: string
          example: NGN
        amountKobo:
          type: integer
          description: Total amount to fund, represented in kobo.
          example: 5500000
        commissionRateBps:
          type: integer
          description: Platform commission rate in basis points; 1000 represents 10%.
          example: 1000
        platformCommissionAmountKobo:
          type: integer
          example: 500000
        workerPayoutAmountKobo:
          type: integer
          example: 5000000
        provider:
          type: string
          enum: [mock, harrenapay]
        providerReference:
          type: string
        providerEscrowId:
          type: string
        checkoutUrl:
          type: string
          format: uri
        virtualAccountNumber:
          type: string
        bankName:
          type: string
        expiresAt:
          type: string
          format: date-time
        fundingStatus:
          type: string
          enum: [pending, funded, failed, refunded]
        completionStatus:
          type: string
          enum: [pending, submitted, confirmed, disputed]
        payoutStatus:
          type: string
          enum: [not_ready, pending, processing, paid, failed, on_hold]
        clientPlatform:
          type: string
          enum: [web, mobile]
        disputeStatus:
          type: string
          enum: [none, open, resolved]
        disputeReason:
          type: string
        payoutReference:
          type: string
        fundedAt:
          type: string
          format: date-time
        completionConfirmedAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time

    HarrenaPayWebhookEvent:
      type: object
      required:
        - event
        - reference
        - amount
        - currency
      properties:
        event:
          type: string
          enum:
            - escrow.funded
            - payment.success
            - payment.failed
        reference:
          type: string
          example: careporium_shift_671234abcd
        amount:
          type: integer
          description: Amount as expected by the backend's webhook validation.
          example: 5500000
        currency:
          type: string
          example: NGN

    PaymentWebhookResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Webhook received

    PaymentErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        shiftId:
          type: string

  responses:
    Success:
      description: Request completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'

    Unauthorized:
      description: Authentication is required or the token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'

    Forbidden:
      description: The user does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'

    ServerError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentErrorResponse'