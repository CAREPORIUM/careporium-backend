openapi: 3.0.3

info:
  title: CAREPORIUM Backend API
  version: 1.0.0
  description: |
    API documentation for the CAREPORIUM healthcare-worker shift marketplace.
    Authentication uses JWT Bearer tokens. Error responses follow the global
    error-handling middleware configured in index.js.

servers:
  - url: http://localhost:8089
    description: Local development server
  - url: https://careporium-backend.onrender.com
    description: Render deployment

tags:
  - name: Authentication
  - name: Worker Profiles
  - name: Facility Profiles
  - name: Shifts
  - name: Shift Applications
  - name: Attendance
  - name: Admin
  - name: Payments

security:
  - bearerAuth: []

paths:

  # =========================
  # AUTHENTICATION
  # =========================

  /api/auth/v1/register/worker:
    post:
      tags: [Authentication]
      summary: Register a worker
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fullName
                - email
                - phoneNumber
                - password
              properties:
                fullName:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                password:
                  type: string
                  format: password
                profession:
                  type: string
                specialty:
                  type: string
                yearsOfExperience:
                  type: integer
                  minimum: 0
                address:
                  type: string
                street:
                  type: string
                state:
                  type: string
                country:
                  type: string
                professionalLicense:
                  type: string
                  format: binary
                idDocument:
                  type: string
                  format: binary
                educationCert:
                  type: string
                  format: binary
                proofOfLocation:
                  type: string
                  format: binary
      responses:
        '201':
          description: Worker account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/register/facility:
    post:
      tags: [Authentication]
      summary: Register a healthcare facility
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - facilityName
                - facilityType
                - email
                - phoneNumber
                - password
                - businessRegCert
                - facilityLicense
                - taxID
              properties:
                facilityName:
                  type: string
                facilityType:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                password:
                  type: string
                  format: password
                location.address:
                  type: string
                location.city:
                  type: string
                location.state:
                  type: string
                location.country:
                  type: string
                secondaryContact.fullName:
                  type: string
                secondaryContact.position:
                  type: string
                secondaryContact.email:
                  type: string
                  format: email
                secondaryContact.phoneNumber:
                  type: string
                businessRegCert:
                  type: string
                  format: binary
                facilityLicense:
                  type: string
                  format: binary
                taxID:
                  type: string
                  format: binary
      responses:
        '201':
          description: Facility account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/verify-account:
    post:
      tags: [Authentication]
      summary: Verify an account using an OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend account verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/logout:
    post:
      tags: [Authentication]
      summary: Log out the authenticated user
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/get-profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/verify-reset-code:
    post:
      tags: [Authentication]
      summary: Verify a password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/resend-reset-code:
    post:
      tags: [Authentication]
      summary: Resend a password-reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/v1/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password using a reset token
      description: Use the temporary reset token if your implementation requires it.
      security:
        - resetTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # WORKER PROFILES
  # =========================

  /api/worker/v1/get-worker-profile/{userId}:
    get:
      tags: [Worker Profiles]
      summary: Get a worker profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/worker/v1/update-worker-profile/{userId}:
    put:
      tags: [Worker Profiles]
      summary: Update a worker profile and upload documents
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                profession:
                  type: string
                specialty:
                  type: string
                yearsOfExperience:
                  type: integer
                  minimum: 0
                address:
                  type: string
                street:
                  type: string
                state:
                  type: string
                country:
                  type: string
                professionalLicense:
                  type: string
                  format: binary
                idDocument:
                  type: string
                  format: binary
                educationCert:
                  type: string
                  format: binary
                proofOfLocation:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # FACILITY PROFILES
  # =========================

  /api/facility/v1/get-facility-profile:
    get:
      tags: [Facility Profiles]
      summary: Get the authenticated facility profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/facility/v1/update-facility-profile:
    put:
      tags: [Facility Profiles]
      summary: Update the authenticated facility profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                facilityName:
                  type: string
                facilityType:
                  type: string
                location:
                  $ref: '#/components/schemas/Location'
                secondaryContact:
                  $ref: '#/components/schemas/SecondaryContact'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # SHIFTS
  # =========================

  /api/shifts/v1/create-shift:
    post:
      tags: [Shifts]
      summary: Create a shift
      description: The facility must be authenticated. If shift posting requires payment, the shift should not become open until payment is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/get-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve available shifts
      description: Intended for authenticated workers. Supported filters must match the shift service implementation.
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
          description: Filter shifts by date.
        - in: query
          name: location
          required: false
          schema:
            type: string
        - in: query
          name: specialty
          required: false
          schema:
            type: string
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/get-shift/{shiftId}:
    get:
      tags: [Shifts]
      summary: Retrieve one shift by ID
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/get-facility-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve shifts posted by the authenticated facility
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/update-shift/{shiftId}:
    put:
      tags: [Shifts]
      summary: Update a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/close-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Close a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/complete-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Mark a shift as completed
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/shifts/v1/delete-shift/{shiftId}:
    delete:
      tags: [Shifts]
      summary: Delete a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # SHIFT APPLICATIONS
  # =========================

  /api/applications/v1/apply/{shiftId}:
    post:
      tags: [Shift Applications]
      summary: Apply for a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/applications/v1/my-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve the authenticated worker's applications
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/applications/v1/facility-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve applications for the authenticated facility's shifts
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/applications/v1/accept/{applicationId}:
    patch:
      tags: [Shift Applications]
      summary: Accept a shift application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/applications/v1/reject/{applicationId}:
    patch:
      tags: [Shift Applications]
      summary: Reject a shift application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # ATTENDANCE
  # =========================

  /api/attendance/v1/qr/{shiftId}:
    get:
      tags: [Attendance]
      summary: Generate or retrieve a shift attendance QR code
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/attendance/v1/clock-in:
    post:
      tags: [Attendance]
      summary: Clock in using an attendance QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/attendance/v1/clock-out:
    post:
      tags: [Attendance]
      summary: Clock out using an attendance QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # ADMIN
  # =========================

  /api/admin/v1/workers:
    get:
      tags: [Admin]
      summary: Retrieve all workers
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/{workerId}:
    get:
      tags: [Admin]
      summary: Retrieve one worker
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/{workerId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a worker document
      description: A comment is required when rejecting a document.
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerDocumentReviewInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities:
    get:
      tags: [Admin]
      summary: Retrieve all facilities
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/pending:
    get:
      tags: [Admin]
      summary: Retrieve facilities with pending verification
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/{facilityId}:
    get:
      tags: [Admin]
      summary: Retrieve one facility
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/{facilityId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a facility document
      description: A comment is required when rejecting a document.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityDocumentReviewInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/pending:
    get:
      tags: [Admin]
      summary: Retrieve workers with pending verification
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/verification-queue:
    get:
      tags: [Admin]
      summary: Retrieve pending worker and facility document reviews
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/dashboard/stats:
    get:
      tags: [Admin]
      summary: Retrieve dashboard statistics
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # =========================
  # PAYMENTS
  # =========================

  /api/payments/v1/retry/{shiftId}:
    post:
      tags: [Payments]
      summary: Retry payment for a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
