openapi: 3.0.3
info:
  title: CAREPORIUM Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the CAREPORIUM healthcare-worker shift marketplace backend.
    This specification is based on the endpoints and request fields discussed so far.
    Confirm each path and HTTP method against the project's route files before treating it
    as an exact representation of the running server.
servers:
  - url: https://careporium-backend.onrender.com
    description: Production server
  - url: http://localhost:8089
    description: Local development server

tags:
  - name: Authentication
  - name: Worker Profiles
  - name: Facility Profiles
  - name: Shifts
  - name: Shift Applications
  - name: Attendance
  - name: Admin
  - name: Payments
    description: CAREPORIUM shift funding and payment webhook endpoints
  - name: HarrenaPay Sandbox Testing
    description: External HarrenaPay endpoint for simulating escrow funding in sandbox tests only

security:
  - bearerAuth: []

paths:
  /api/auth/v1/register/worker:
    post:
      tags: [Authentication]
      summary: Register a worker account and profile
      description: Creates a worker account and profile using JSON. Document uploads are handled through the worker profile update endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phoneNumber, password]
              properties:
                fullName: { type: string, example: Ada Okafor }
                email: { type: string, format: email, example: ada@example.com }
                phoneNumber: { type: string, example: "+2348012345678" }
                password: { type: string, format: password, minLength: 8 }
                profession: { type: string, example: Nurse }
                specialty: { type: string, example: Emergency }
                yearsOfExperience: { type: integer, minimum: 0, example: 3 }
                location.address: { type: string }
                location.city: { type: string }
                location.state: { type: string }
                location.country: { type: string, example: Nigeria }

      responses:
        '201':
          description: Worker account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/register/facility:
    post:
      tags: [Authentication]
      summary: Register a facility account and profile
      description: Creates a facility account and profile using JSON. Document uploads are handled through the worker profile update endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facilityName, facilityType, email, phoneNumber, password]
              properties:
                facilityName: { type: string, example: CarePlus Hospital }
                facilityType: { type: string, example: Hospital }
                email: { type: string, format: email }
                phoneNumber: { type: string }
                password: { type: string, format: password, minLength: 8 }
                location.address: { type: string }
                location.city: { type: string }
                location.state: { type: string }
                location.country: { type: string, example: Nigeria }
                secondaryContact.fullName: { type: string }
                secondaryContact.position: { type: string }
                secondaryContact.email: { type: string, format: email }
                secondaryContact.phoneNumber: { type: string }
      responses:
        '201':
          description: Facility account created; verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/verify-account:
    post:
      tags: [Authentication]
      summary: Verify account with email OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string, minLength: 6, maxLength: 6, example: '123456' }
      responses:
        '200':
          description: Account verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/resend-otp:
    post:
      tags: [Authentication]
      summary: Resend account verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserSummary'
                  token: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/logout:
    post:
      tags: [Authentication]
      summary: Log out by invalidating previously issued tokens
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/v1/get-profile:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's base profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/v1/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset OTP
      description: Sends a password-reset OTP to the account email. A generic response should be returned whether or not the email exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: user@example.com }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/verify-reset-code:
    post:
      tags: [Authentication]
      summary: Verify password-reset OTP
      description: Verifies the OTP and returns a short-lived, single-use reset token. The email is not submitted to this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  pattern: '^\d{6}$'
                  example: '123456'
      responses:
        '200':
          description: OTP verified; temporary reset token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Password reset code verified successfully }
                  data:
                    type: object
                    properties:
                      resetToken:
                        type: string
                        description: Temporary token used only for resetting the password
                      expiresIn:
                        type: integer
                        example: 600
                        description: Token lifetime in seconds
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/resend-reset-code:
    post:
      tags: [Authentication]
      summary: Resend password-reset OTP
      description: Sends a replacement OTP to the provided email. A resend cooldown may apply.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: user@example.com }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/v1/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password using a temporary reset token
      description: Send the reset token returned by verify-reset-code as a Bearer token. Do not use the normal login JWT. The token is short-lived and single-use.
      security:
        - resetTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, format: password, minLength: 8, example: StrongPassword123! }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/worker/v1/get-worker-profile/{userId}:
    get:
      tags: [Worker Profiles]
      summary: Get a worker profile
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/worker/v1/update-worker-profile:
    put:
      tags: [Worker Profiles]
      summary: Update a worker profile
      description: Updates worker profile details, uploads new verification documents, or replaces existing documents. All fields are optional, so documents can be uploaded without sending text fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                profession:
                  type: string
                specialty:
                  type: string
                yearsOfExperience:
                  type: integer
                  minimum: 0
                about:
                  type: string
                locationAddress:
                  type: string
                locationStreet:
                  type: string
                locationState:
                  type: string
                locationCountry:
                  type: string
                professionalLicense:
                  type: string
                  format: binary
                idDocument:
                  type: string
                  format: binary
                educationCert:
                  type: string
                  format: binary
                proofOfLocation:
                  type: string
                  format: binary
      responses:
        '200':
          description: Worker profile updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication required
        '404':
          description: Worker profile not found 

  /api/facility/v1/get-facility-profile:
    get:
      tags: [Facility Profiles]
      summary: Get the authenticated facility profile
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/facility/v1/update-facility-profile:
    put:
      tags: [Facility Profiles]
      summary: Update the authenticated facility profile
      description: Updates facility profile details, uploads new verification documents, or replaces existing documents. All fields are optional, so documents can be uploaded without sending text fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                facilityName:
                  type: string
                facilityType:
                  type: string
                locationAddress:
                  type: string
                locationCity:
                  type: string
                locationState:
                  type: string
                locationCountry:
                  type: string
                secondaryContactFullName:
                  type: string
                secondaryContactPosition:
                  type: string
                secondaryContactEmail:
                  type: string
                  format: email
                secondaryContactPhoneNumber:
                  type: string
                businessRegCert:
                  type: string
                  format: binary
                facilityLicense:
                  type: string
                  format: binary
                taxID:
                  type: string
                  format: binary
      responses:
        '200':
          description: Facility profile updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Authentication required
        '404':
          description: Facility profile not found
  /api/shifts/v1/create-shift:
    post:
      summary: Create a new shift
      tags:
        - Shifts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profession
                - shiftDate
                - shiftType
                - startTime
                - endTime
                - professionalsNeeded
                - minimumExperience
                - location
                - payRate
              properties:
                profession:
                  type: string
                  example: Nurse
                specialty:
                  type: string
                  example: General Nursing
                shiftDate:
                  type: string
                  example: "2026-10-20"
                shiftType:
                  type: string
                  example: Day
                startTime:
                  type: string
                  example: "08:00"
                endTime:
                  type: string
                  example: "20:00"
                professionalsNeeded:
                  type: integer
                  minimum: 1
                  example: 2
                minimumExperience:
                  type: string
                  example: "2 years"
                location:
                  type: string
                  example: "Akindele, Ikeja, Lagos, Nigeria"
                responsibilities:
                  type: string
                  example: "Provide patient care and monitor vital signs"
                reqCredentials:
                  type: string
                  example: "Valid professional license"
                arrivalInstructions:
                  type: string
                  example: "Report to the facility reception"
                payRate:
                  type: number
                  minimum: 0
                  example: 50000
                isUrgent:
                  type: boolean
                  example: false
      responses:
        "201":
         description: Shift created successfully
        "400":
          description: Invalid shift data or payment initiation failed
  /api/shifts/v1/get-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve shifts
      parameters:
        - in: query
          name: status
          schema: { type: string, example: open }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: specialty
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/shifts/v1/get-shift/{shiftId}:
    get:
      tags: [Shifts]
      summary: Retrieve a shift by ID
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/shifts/v1/get-facility-shifts:
    get:
      tags: [Shifts]
      summary: Retrieve shifts posted by the authenticated facility
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/shifts/v1/update-shift/{shiftId}:
    put:
      tags: [Shifts]
      summary: Update a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/shifts/v1/close-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Close a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/shifts/v1/complete-shift/{shiftId}:
    patch:
      tags: [Shifts]
      summary: Mark a shift as completed
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/shifts/v1/delete-shift/{shiftId}:
    delete:
      tags: [Shifts]
      summary: Delete a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/applications/v1/apply/{shiftId}:
    post:
      tags: [Shift Applications]
      summary: Apply for a shift as a worker
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/applications/v1/my-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve applications submitted by the authenticated worker
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/applications/v1/facility-applications:
    get:
      tags: [Shift Applications]
      summary: Retrieve applications for the authenticated facility's shifts
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/applications/v1/accept/{applicationId}:
    patch:
      tags: [Shift Applications]
      summary: Accept a shift application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/applications/v1/reject/{applicationId}:
    patch:
      tags: [Shift Applications]
      summary: Reject a shift application
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/attendance/v1/qr/{shiftId}:
    get:
      tags: [Attendance]
      summary: Generate or retrieve a shift attendance QR token
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/attendance/v1/clock-in:
    post:
      tags: [Attendance]
      summary: Clock in using a QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/attendance/v1/clock-out:
    post:
      tags: [Attendance]
      summary: Clock out using a QR token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/admin/v1/workers:
    get:
      tags: [Admin]
      summary: Retrieve all workers
      description: Admin access required. Returns worker profiles with populated user details excluding password and OTP fields.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/workers/{workerId}:
    get:
      tags: [Admin]
      summary: Retrieve one worker by ID
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/v1/workers/{workerId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a worker document
      description: Rejecting a document requires a non-empty comment. The worker verification status is recalculated from all four required documents.
      parameters:
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerDocumentReviewInput'
            examples:
              verifyDocument:
                summary: Verify a professional license
                value:
                  documentType: professionalLicense
                  status: verified
              rejectDocument:
                summary: Reject an identity document
                value:
                  documentType: idDocument
                  status: rejected
                  comment: The uploaded document is unclear.
      responses:
        '200':
          description: Document review saved and worker verification status recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/facilities:
    get:
      tags: [Admin]
      summary: Retrieve all facilities
      description: Admin access required. Returns facility profiles with populated user details excluding password and OTP fields.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/pending:
    get:
      tags: [Admin]
      summary: Retrieve facilities with pending overall verification status
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/facilities/{facilityId}:
    get:
      tags: [Admin]
      summary: Retrieve one facility by ID
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/v1/facilities/{facilityId}/documents:
    patch:
      tags: [Admin]
      summary: Verify or reject a facility document
      description: Rejecting a document requires a non-empty comment. Facility verification status is recalculated from all three required documents.
      parameters:
        - $ref: '#/components/parameters/FacilityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityDocumentReviewInput'
            examples:
              verifyDocument:
                summary: Verify a business registration certificate
                value:
                  documentType: businessRegCert
                  status: verified
              rejectDocument:
                summary: Reject a tax identification document
                value:
                  documentType: taxID
                  status: rejected
                  comment: The uploaded tax document is invalid.
      responses:
        '200':
          description: Document review saved and facility verification status recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/v1/workers/pending:
    get:
      tags: [Admin]
      summary: Retrieve workers with pending overall verification status
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/verification-queue:
    get:
      tags: [Admin]
      summary: Retrieve individual worker and facility documents awaiting verification
      description: Returns one queue item per uploaded document whose document verificationStatus is pending, sorted newest profile submission first.
      responses:
        '200':
          description: Combined verification queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerificationQueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/v1/dashboard/stats:
    get:
      tags: [Admin]
      summary: Retrieve admin dashboard statistics
      description: Returns counts of workers, verified workers, facilities, verified facilities, pending individual document reviews, active shifts (open or filled), and completed shifts.
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalWorkers: { type: integer, example: 120 }
                      verifiedWorkers: { type: integer, example: 78 }
                      totalFacilities: { type: integer, example: 25 }
                      verifiedFacilities: { type: integer, example: 18 }
                      pendingVerifications: { type: integer, example: 14 }
                      activeShifts: { type: integer, example: 9 }
                      completedShifts: { type: integer, example: 43 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  # CAREPORIUM payment endpoints
  /api/payments/v1/harrenapay/webhook:
    post:
      tags: [Payments]
      summary: Receive HarrenaPay payment webhook
      description: >
        Receives payment notifications from HarrenaPay. The request must contain
        the original raw JSON body and a valid HMAC-SHA256 hexadecimal signature
        in the x-harrenapay-signature header. Invalid signatures are rejected.
      operationId: handleHarrenaPayWebhook
      security: []
      parameters:
        - in: header
          name: x-harrenapay-signature
          required: true
          description: HMAC-SHA256 hexadecimal signature of the original raw request body.
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: HarrenaPay webhook event payload; exact event fields depend on HarrenaPay's webhook schema.
              additionalProperties: true
      responses:
        '200':
          description: Webhook received and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Webhook received
        '400':
          description: Invalid webhook payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid webhook payload
        '401':
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid webhook signature
        '500':
          description: Unable to process webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unable to process webhook

  /api/payments/v1/retry/{shiftId}:
    post:
      tags: [Payments]
      summary: Retry shift payment
      description: Retries funding for an existing shift using its existing payment record. Only the facility that owns the shift can retry its payment.
      operationId: retryShiftPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          description: Payment funding request processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Payment funding request processed }
                  data:
                    type: object
                    properties:
                      shiftId: { type: string, example: 652abc123456789012345678 }
                      payment:
                        type: object
                        description: Payment record returned by the payment service; fields depend on the Payment model and service.
                        additionalProperties: true
        '400':
          description: Payment retry failed or request could not be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only facility accounts can retry shift payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Only facility accounts can retry shift payments
        '404':
          description: Facility or facility-owned shift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                facilityNotFound:
                  value:
                    success: false
                    message: Facility not found
                shiftNotFound:
                  value:
                    success: false
                    message: Shift not found for this facility

  # External HarrenaPay sandbox endpoint; not hosted by CAREPORIUM
  /api/public/v1/escrow/{reference}/simulate-fund:
    post:
      tags: [HarrenaPay Sandbox Testing]
      summary: Simulate escrow funding in HarrenaPay sandbox
      description: >
        External HarrenaPay endpoint, not a CAREPORIUM backend route.
        Use only for sandbox testing with a HarrenaPay test API key. Never
        expose the secret API key in frontend or mobile application code.
      operationId: simulateHarrenaPayEscrowFunding
      servers:
        - url: https://www.harrenapay.com
          description: HarrenaPay API host
      security:
        - harrenapayApiKey: []
      parameters:
        - in: path
          name: reference
          required: true
          description: HarrenaPay escrow reference to simulate funding for.
          schema:
            type: string
      responses:
        '200':
          description: HarrenaPay accepted the simulation request. Confirm the exact response schema against HarrenaPay's current API reference.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request or escrow reference
        '401':
          description: Invalid or missing HarrenaPay API key
        '404':
          description: Escrow reference not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    resetTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: ResetToken
      description: Temporary token returned by verify-reset-code. Use only for reset-password, not as a normal login JWT.
    harrenapayApiKey:
      type: http
      scheme: bearer
      bearerFormat: HarrenaPay API key
      description: >
        HarrenaPay API key for server-to-server requests. Use a sandbox key
        for sandbox testing and never expose it publicly.

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    WorkerId:
      in: path
      name: workerId
      required: true
      schema: { type: string }
    FacilityId:
      in: path
      name: facilityId
      required: true
      schema: { type: string }
    ShiftId:
      in: path
      name: shiftId
      required: true
      schema: { type: string }
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema: { type: string }

  schemas:
    RegistrationResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            userId: { type: string }
            workerId: { type: string }
            facilityId: { type: string }

    UserSummary:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [worker, facility, admin] }
        isVerified: { type: boolean }

    Location:
      type: object
      properties:
        address: { type: string }
        street: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }

    SecondaryContact:
      type: object
      properties:
        fullName: { type: string }
        position: { type: string }
        email: { type: string, format: email }
        phoneNumber: { type: string }

    ShiftInput:
      type: object
      required: [role, date, startTime, endTime]
      properties:
        role: { type: string, example: Nurse }
        specialty: { type: string }
        workType: { type: string }
        description: { type: string }
        requirements:
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        professionalsNeeded: { type: integer, minimum: 1 }
        date: { type: string, format: date }
        startTime: { type: string, example: "08:00" }
        endTime: { type: string, example: "16:00" }
        shiftType: { type: string }
        location:
          $ref: '#/components/schemas/Location'

    WorkerDocumentReviewInput:
      type: object
      required: [documentType, status]
      properties:
        documentType:
          type: string
          enum: [professionalLicense, idDocument, educationCert, proofOfLocation]
          example: professionalLicense
        status:
          type: string
          enum: [verified, rejected]
          example: verified
        comment:
          type: string
          description: Required when status is rejected.
          example: The uploaded document is unclear.

    FacilityDocumentReviewInput:
      type: object
      required: [documentType, status]
      properties:
        documentType:
          type: string
          enum: [businessRegCert, facilityLicense, taxID]
          example: businessRegCert
        status:
          type: string
          enum: [verified, rejected]
          example: verified
        comment:
          type: string
          description: Required when status is rejected.
          example: The uploaded document is invalid.

    VerificationQueueItem:
      type: object
      properties:
        _id: { type: string }
        type: { type: string, enum: [worker, facility] }
        name: { type: string }
        documentType: { type: string }
        documentUrl: { type: string, format: uri }
        documentVerificationStatus: { type: string, enum: [pending] }
        verificationComment: { type: string }
        submittedAt: { type: string, format: date-time }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Something went wrong }

  responses:
    Success:
      description: Request completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

    BadRequest:
      description: Invalid input or request could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: User is not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'