  /api/payments/v1/shift/{shiftId}:
    get:
      tags: [Payments]
      summary: Retrieve payment status for a shift
      parameters:
        - $ref: '#/components/parameters/ShiftId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    resetTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: ResetToken
      description: Temporary reset token, only if supported by the reset-password implementation.

  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
    WorkerId:
      in: path
      name: workerId
      required: true
      schema:
        type: string
    FacilityId:
      in: path
      name: facilityId
      required: true
      schema:
        type: string
    ShiftId:
      in: path
      name: shiftId
      required: true
      schema:
        type: string
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true

    UserSummary:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [worker, facility, admin]
        isVerified:
          type: boolean

    Location:
      type: object
      properties:
        address:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string

    SecondaryContact:
      type: object
      properties:
        fullName:
          type: string
        position:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string

    ShiftInput:
      type: object
      required:
        - profession
        - shiftDate
        - shiftType
        - startTime
        - endTime
        - professionalsNeeded
      properties:
        profession:
          type: string
          example: Nurse
        specialty:
          type: string
          example: Emergency
        shiftDate:
          type: string
          example: "2026-10-20"
        shiftType:
          type: string
          example: Day
        startTime:
          type: string
          example: "08:00"
        endTime:
          type: string
          example: "16:00"
        professionalsNeeded:
          type: integer
          minimum: 1
        minimumExperience:
          type: integer
          minimum: 0
        location:
          type: string
          example: Ikeja, Lagos
        responsibilities:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
        requirements:
          oneOf:
            - type: array
              items:
                type: string
            - type: string

    WorkerDocumentReviewInput:
      type: object
      required: [documentType, status]
      properties:
        documentType:
          type: string
          enum:
            - professionalLicense
            - idDocument
            - educationCert
            - proofOfLocation
        status:
          type: string
          enum: [verified, rejected]
        comment:
          type: string
          description: Required when rejecting a document.

    FacilityDocumentReviewInput:
      type: object
      required: [documentType, status]
      properties:
        documentType:
          type: string
          enum:
            - businessRegCert
            - facilityLicense
            - taxID
        status:
          type: string
          enum: [verified, rejected]
        comment:
          type: string
          description: Required when rejecting a document.

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          examples:
            - Not found
            - Invalid JSON request body
            - Origin not allowed
            - Request failed
            - Internal server error
            - Too many requests. Please try again later.

  responses:
    Success:
      description: Request completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'

    BadRequest:
      description: Invalid request or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJson:
              summary: Invalid JSON request body
              value:
                success: false
                message: Invalid JSON request body
            requestFailed:
              summary: Other client-side request failure
              value:
                success: false
                message: Request failed

    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: The request is not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Origin not allowed

    NotFound:
      description: Requested resource or route was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Not found

    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Internal server error

    TooManyRequests:
      description: Rate limit exceeded, if the authentication rate limiter is applied to this route
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Too many requests. Please try again later.